# SkinAI stack:
#
#   browser ──► web      :${WEB_PORT:-3000}       (patients, doctors + admin portal at /admin, nginx)
#   phones  ──► node-api :${NODE_API_PORT:-5000}  (Expo app talks to the Node API directly)
#                  │
#                  ├──► backend (FastAPI + model, internal only, not published)
#                  └──► MongoDB Atlas (MONGODB_URI from feedback-api/.env)
#
# Usage:  docker compose up -d --build
# Ports can be changed without editing this file, e.g.  WEB_PORT=8081 docker compose up -d

services:
  backend:
    build:
      context: ./backend
    image: skinai-backend:latest
    container_name: skinai-backend
    restart: unless-stopped
    # No published port: only node-api (inside the network) calls it,
    # same as binding FastAPI to 127.0.0.1 in local development.
    expose:
      - "8000"
    environment:
      SKINAI_MODEL_DIR: /app/weights
    networks:
      - skinai-net

  node-api:
    build:
      context: ./feedback-api
    image: skinai-node-api:latest
    container_name: skinai-node-api
    restart: unless-stopped
    # Secrets (MONGODB_URI, JWT_SECRET, SMTP_*) come from the same .env used in
    # local development; they are read at runtime, never copied into the image.
    env_file:
      - ./feedback-api/.env
    # These override the matching .env values for the container setup.
    environment:
      PORT: "5000"
      FASTAPI_URL: http://backend:8000
      # Behind nginx: trust X-Forwarded-For so rate limits see the real client IP.
      TRUST_PROXY: "true"
      # Browser origins that call the API directly (the nginx-served web app is
      # same-origin; 5173 = local Vite dev server, 8081 = Expo web).
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000},http://localhost:5173,http://localhost:8081
    ports:
      # Published for the mobile app (phones on your Wi-Fi use http://<PC-LAN-IP>:5000).
      - "${NODE_API_PORT:-5000}:5000"
    volumes:
      - node-uploads:/app/uploads # lesion images (referenced by MongoDB records)
      - node-outbox:/app/outbox # emails saved when SMTP isn't configured
    depends_on:
      backend:
        condition: service_started
    networks:
      - skinai-net

  web:
    build:
      context: ./web
    image: skinai-web:latest
    container_name: skinai-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - node-api
    networks:
      - skinai-net

networks:
  skinai-net:
    driver: bridge

volumes:
  node-uploads:
  node-outbox:
