# web/: patient & doctor web app. Its only backend is the Node API (which
# forwards predictions to FastAPI), so everything under /api goes there.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Lesion uploads are capped at 8 MB by the Node API.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Docker's internal DNS, re-resolved every 10 s. Using a variable in
    # proxy_pass means nginx starts even if node-api isn't up yet and keeps
    # working when that container restarts with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $node_api http://node-api:5000;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass $node_api;
        # Predictions (CPU inference) and consultation emails can take a while.
        proxy_read_timeout 120s;
    }

    location ^~ /uploads/ {
        proxy_pass $node_api;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routes (/login, /results/:id, ...) fall back to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
